        function getEnglishInfo() {
            // Similar detailed English content
            return getHindiInfo().replace(/हिंदी/g, 'English'); // Placeholder
        }

        // ================== JAVASCRIPT FUNCTIONS ==================
        function changeLanguage(lang) {
            currentLanguage = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Update text
            Object.keys(translations[lang]).forEach(id => {
                const el = document.getElementById(id.replace(/Btn|Title|Input|Tip/, '') + 
                    (id.includes('Btn') ? 'Btn' : id.includes('Title') ? 'Title' : 
                     id.includes('Input') ? 'Input' : id.includes('Tip') ? 'Tip' : ''));
                if (el) el.textContent = translations[lang][id];
                if (id === 'searchPlaceholder') document.getElementById('searchInput').placeholder = translations[lang][id];
            });

            allVideos = [...videoDatabase[lang]];
            displayAllVideos();
            if (currentPage === 'info') loadInfoContent();
        }

        let currentPage = 'videos';
        function showSection(section) {
            currentPage = section;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(section + 'Btn').classList.add('active');
            document.getElementById('videosSection').classList.toggle('hidden', section !== 'videos');
            document.getElementById('infoSection').classList.toggle('hidden', section !== 'info');
            if (section === 'videos') displayAllVideos();
            else loadInfoContent();
        }

        function displayAllVideos() {
            const container = document.getElementById('videoResults');
            const noVideosText = translations[currentLanguage].noVideos;
            const watchText = translations[currentLanguage].watchVideo;

            if (allVideos.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #718096; font-size: 1.2em;">${noVideosText}</p>`;
                return;
            }
            container.innerHTML = allVideos.map(video => `
                <div class="video-card">
                    <div class="video-thumbnail">▶️</div>
                    <div class="video-info">
                        <div class="video-title">${video.title}</div>
                        <div class="video-description">${video.description}</div>
                        <div style="margin-bottom: 10px; color: #667eea; font-size: 0.9em;">👨‍🌾 ${video.expert}</div>
                        <a href="${video.link}" target="_blank" class="video-link">${watchText}</a>
                    </div>
                </div>
            `).join('');
        }

        function searchVideos() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) {
                allVideos = [...videoDatabase[currentLanguage]];
                displayAllVideos();
                return;
            }

            allVideos = videoDatabase[currentLanguage].filter(video => 
                video.title.toLowerCase().includes(query) ||
                video.description.toLowerCase().includes(query) ||
                video.keywords.some(k => k.toLowerCase().includes(query) || query.includes(k.toLowerCase()))
            );
            displayAllVideos();
        }

        function loadInfoContent() {
            document.getElementById('infoContent').innerHTML = 
                currentLanguage === 'hindi' ? getHindiInfo() : getEnglishInfo();
        }

        // Enter key search
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchVideos();
        });

        // Initialize
        displayAllVideos();
    </script>
