        }

        }

            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 60px;
        }

        h1 {
            color: #2d3748;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .tagline {
            color: #4a5568;
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        .language-toggle {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .lang-btn {
            padding: 10px 25px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #e2e8f0;
            color: #2d3748;
        }

        .lang-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: scale(1.05);
        }

        .search-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .search-box {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 250px;
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-btn {
            padding: 15px 35px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .schemes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .scheme-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);

        }

            font-size: 50px;
            margin-bottom: 15px;
        }

        .scheme-title {
            color: #2d3748;
            font-size: 1.4em;
            margin-bottom: 10px;
            font-weight: bold;
        }

            display: inline-block;

            border-radius: 20px;

            margin-bottom: 15px;
        }

            color: #4a5568;
            line-height: 1.6;
            margin-bottom: 20px;
            font-size: 0.95em;
        }

            margin: 20px 0;
            padding: 15px;
            background: #f7fafc;
            border-radius: 12px;

        }

            list-style: none;
            padding-left: 0;

            padding: 5px 0;
            padding-left: 20px;

        }

            content: "→";

            left: 0;
            color: #667eea;
            font-weight: bold;
        }

            background: #e6fffa;

        }

            font-weight: bold;

            align-items: center;

</head>

        function changeLanguage(lang) {
            currentLanguage = lang;
            
            document.getElementById('hindiBtn').classList.toggle('active', lang === 'hi');
            document.getElementById('englishBtn').classList.toggle('active', lang === 'en');
            
            const t = translations[lang];
            document.getElementById('mainTitle').textContent = t.mainTitle;
            document.getElementById('tagline').textContent = t.tagline;
            document.getElementById('searchTitle').textContent = t.searchTitle;
            document.getElementById('citySearch').placeholder = t.searchPlaceholder;
            document.getElementById('searchBtn').textContent = t.searchBtn;
            document.getElementById('footerText').textContent = t.footerText;
            document.getElementById('disclaimerText').textContent = t.disclaimerText;
            
            searchSchemes();
        }

        function searchSchemes() {
            const searchTerm = document.getElementById('citySearch').value.toLowerCase().trim();
            const container = document.getElementById('schemesContainer');
            const currentSchemes = schemes[currentLanguage];
            const t = translations[currentLanguage];
            
            let filteredSchemes = currentSchemes;
            
            if (searchTerm) {
                filteredSchemes = currentSchemes.filter(scheme => 
                    scheme.cities.some(city => city.toLowerCase().includes(searchTerm)) ||
                    scheme.location.toLowerCase().includes(searchTerm) ||
                    scheme.title.toLowerCase().includes(searchTerm)
                );
            }
            
            if (filteredSchemes.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">😔</div>
                        <h2>${t.noResults}</h2>
                        <p style="margin-top: 15px;">${t.noResultsSubtext}</p>
                    </div>
                `;
            } else {
                container.innerHTML = filteredSchemes.map(scheme => `
                    <div class="scheme-card">
                        <div class="scheme-icon">${scheme.icon}</div>
                        <h3 class="scheme-title">${scheme.title}</h3>
                        <span class="scheme-type">${scheme.type}</span>
                        <p class="scheme-details">${scheme.details}</p>
                        
                        <div class="info-section benefits-box">
                            <h4>${t.whatYouGetTitle}</h4>
                            <p>${scheme.whatYouGet}</p>
                        </div>
                        
                        <div class="info-section eligibility-box">
                            <h4>${t.eligibilityTitle}</h4>
                            <ul>
                                ${scheme.eligibility.map(item => `<li>${item}</li>`).join('')}
                            </ul>
                        </div>
                        
                        <div class="info-section steps-box">
                            <h4>${t.howToApplyTitle}</h4>
                            <ul>
                                ${scheme.howToApply.map(item => `<li>${item}</li>`).join('')}
                            </ul>
                        </div>
                        
                        <div class="info-section contact-box">
                            <h4>${t.contactTitle}</h4>
                            <p>${scheme.contact}</p>
                        </div>
                        
                        <p class="scheme-location">📍 ${scheme.location}</p>
                        <span class="update-date">${t.lastUpdatedText} ${scheme.lastUpdated}</span>
                    </div>
                `).join('');
            }
        }
